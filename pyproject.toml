[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gzhseam"
version = "0.4.0"
description = "GzhSeam — wash coding-agent HTML into 公众号-native editable HTML."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "SuperMarioYL" }]
keywords = [
    "gongzhonghao",
    "html",
    "coding-agent",
    "publish-format",
    "wechat",
    "weixin",
    "wysiwyg",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
gzhseam = "gzhseam.cli:main"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/gzhseam"
Repository = "https://github.com/SuperMarioYL/gzhseam"
Issues = "https://github.com/SuperMarioYL/gzhseam/issues"

[tool.setuptools]
packages = ["gzhseam", "gzhseam.api"]

[tool.setuptools.package-data]
gzhseam = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

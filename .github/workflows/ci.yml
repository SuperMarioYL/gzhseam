name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Show environment
        run: |
          python --version
          python -c "import gzhseam; print('gzhseam', gzhseam.__version__)"
          gzhseam --version

      - name: Run tests
        run: pytest -q

      - name: Wash the sample deck (smoke)
        run: |
          gzhseam wash tests/fixtures/sample_deck.html -o /tmp/gzh-smoke.html
          test -s /tmp/gzh-smoke.html
          ! grep -q '<script' /tmp/gzh-smoke.html
          ! grep -q 'onclick' /tmp/gzh-smoke.html
          ! grep -q '<canvas' /tmp/gzh-smoke.html
